version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dependencies:
        patterns: ['*']
    ignore:
      # @astrojs/check 0.9.x only supports TypeScript 5–6. Remove this once it supports TypeScript 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
